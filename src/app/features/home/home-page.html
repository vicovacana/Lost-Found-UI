<div class="page home-page">
  <div class="home-header">
    <select class="input grad-select" [ngModel]="city()" (ngModelChange)="city.set($event); onCityChange()">
      <option value="">Svi gradovi</option>
      @for (g of SERBIAN_CITIES; track g) {
        <option [value]="g">{{ g }}</option>
      }
    </select>

    <input
      class="input"
      type="search"
      placeholder="Pretraga po nazivu ili opisu…"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
    />

    <div class="seg">
      <button type="button" class="seg-opt" [class.active]="type() === 'svi'" (click)="setType('svi')">Svi</button>
      <button type="button" class="seg-opt" [class.active]="type() === ListingType.Lost" (click)="setType(ListingType.Lost)">
        Izgubljeno
      </button>
      <button type="button" class="seg-opt" [class.active]="type() === ListingType.Found" (click)="setType(ListingType.Found)">
        Nađeno
      </button>
    </div>

    <div class="chip-row">
      @for (k of CATEGORIES; track k) {
        <button type="button" class="chip" [class.active]="category() === k" (click)="toggleCategory(k)">
          {{ CATEGORY_LABELS[k] }}
        </button>
      }
    </div>

    @if (auth.isAdmin()) {
      <div class="seg">
        <button type="button" class="seg-opt" [class.active]="statusFilter() === 'svi'" (click)="setStatusFilter('svi')">Svi</button>
        <button type="button" class="seg-opt" [class.active]="statusFilter() === 'aktivni'" (click)="setStatusFilter('aktivni')">
          Aktivni
        </button>
        <button type="button" class="seg-opt" [class.active]="statusFilter() === 'neaktivni'" (click)="setStatusFilter('neaktivni')">
          Neaktivni
        </button>
      </div>
    }
  </div>

  <div class="results-header">
    <span class="text-muted results-count">{{ filtered().length }} oglasa</span>
  </div>

  @if (loading()) {
    <div class="empty-state">
      <p class="text-muted">Učitavanje…</p>
    </div>
  } @else if (filtered().length === 0) {
    <div class="empty-state">
      <h3>Nema oglasa</h3>
      <p class="text-muted">Pokušaj da promeniš filtere ili pretragu.</p>
    </div>
  } @else {
    <div class="oglas-list">
      @for (listing of filtered(); track listing.listingId) {
        <app-listing-card [listing]="listing" />
      }
    </div>
  }
</div>
