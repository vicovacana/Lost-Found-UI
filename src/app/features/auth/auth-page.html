<div class="page auth-page">
  <div class="brand-kicker">Lost&amp;Found</div>
  <h1>Izgubio si?<br />Neko ga je našao.</h1>
  <p class="text-muted">
    Objavi šta si izgubio ili našao. Admin proverava podudaranje pre nego što se bilo šta podeli.
  </p>

  <div class="seg" style="margin: var(--space-4) 0">
    <button type="button" class="seg-opt" [class.active]="tab() === 'login'" (click)="setTab('login')">
      Prijava
    </button>
    <button type="button" class="seg-opt" [class.active]="tab() === 'signup'" (click)="setTab('signup')">
      Registracija
    </button>
  </div>

  @if (tab() === 'login') {
    <form (ngSubmit)="submitLogin()">
      <div class="field">
        <label for="login-username">Korisničko ime</label>
        <input id="login-username" class="input" name="loginUsername" [(ngModel)]="loginUsername" required />
      </div>
      <div class="field">
        <label for="login-password">Lozinka</label>
        <div class="password-wrap">
          <input
            id="login-password"
            class="input"
            [type]="loginPasswordVisible() ? 'text' : 'password'"
            name="loginPassword"
            [(ngModel)]="loginPassword"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleLoginPasswordVisible()"
            [attr.aria-label]="loginPasswordVisible() ? 'Sakrij lozinku' : 'Prikaži lozinku'"
          >
            @if (loginPasswordVisible()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 3l18 18" stroke-linecap="round" />
                <path
                  d="M6.5 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.9-.8M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">Prijavi se</button>
    </form>
  } @else {
    <form (ngSubmit)="submitSignup()">
      <div class="field">
        <label for="signup-username">Korisničko ime</label>
        <input id="signup-username" class="input" name="signupUsername" [(ngModel)]="signupUsername" required />
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input id="signup-email" class="input" type="email" name="signupEmail" [(ngModel)]="signupEmail" required />
      </div>
      <div class="field">
        <label for="signup-password">Lozinka</label>
        <div class="password-wrap">
          <input
            id="signup-password"
            class="input"
            [type]="signupPasswordVisible() ? 'text' : 'password'"
            name="signupPassword"
            [(ngModel)]="signupPassword"
            required
            minlength="6"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleSignupPasswordVisible()"
            [attr.aria-label]="signupPasswordVisible() ? 'Sakrij lozinku' : 'Prikaži lozinku'"
          >
            @if (signupPasswordVisible()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 3l18 18" stroke-linecap="round" />
                <path
                  d="M6.5 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.9-.8M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">Registruj se</button>
    </form>
  }

  <a class="btn btn-ghost btn-block" routerLink="/" style="margin-top: var(--space-2)">
    Nastavi bez naloga
  </a>
</div>
