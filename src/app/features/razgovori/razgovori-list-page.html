<div class="page razgovori-page">
  <h1>Razgovori</h1>

  <div class="chip-row" style="margin-bottom: var(--space-4)">
    <button type="button" class="chip" [class.active]="tab() === StatusRazgovora.Otvoren" (click)="setTab(StatusRazgovora.Otvoren)">
      Otvoreni · {{ otvorenihCount() }}
    </button>
    <button type="button" class="chip" [class.active]="tab() === StatusRazgovora.Zatvoren" (click)="setTab(StatusRazgovora.Zatvoren)">
      Zatvoreni · {{ zatvorenihCount() }}
    </button>
  </div>

  @if (loading()) {
    <p class="text-muted">Učitavanje…</p>
  } @else if (filtered().length === 0) {
    <div class="empty-state">
      <p class="text-muted">Nema razgovora u ovoj kategoriji.</p>
    </div>
  } @else {
    <div class="thread-list">
      @for (r of filtered(); track r.razgovorId) {
        <a class="thread-item card" [routerLink]="['/razgovori', r.razgovorId]">
          <span class="thread-title">{{ r.oglasNaziv }}</span>
          <span class="thread-meta text-muted">{{ r.datumKreiranja | date: 'd. MMM yyyy' }}</span>
          <app-status-tag [razgovor]="r.statusRazgovora" />
        </a>
      }
    </div>
  }
</div>
